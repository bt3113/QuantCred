name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run package:offline
      - run: npm run package:examples
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-offline/quantcred-offline.zip
            public/schemas/*.json
