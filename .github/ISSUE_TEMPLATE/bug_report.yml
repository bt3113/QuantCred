name: Bug report
description: Report a reproducible QuantCred bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What broke, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List exact steps. Include file schema, not private data.
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version / commit SHA
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
  - type: textarea
    id: console
    attributes:
      label: Console errors
      render: shell
